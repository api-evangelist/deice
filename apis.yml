aid: deice
name: Deice
description: 'De-Ice Technologies is an aviation deep-tech company that develops a fast, chemical-free
  aircraft de-icing system to replace traditional glycol chemical spray methods. Spun out of MIT in 2015
  by co-founders Alexander Bratianu-Badea and Ruben Toubiana, the Somerville, Massachusetts company uses
  gallium nitride (GaN) semiconductors to generate high-frequency electric current through tape-like
  strips attached to an aircraft''s exterior, melting snow and ice during the boarding window instead of
  the usual 30-45 minute glycol spray delay. The approach eliminates glycol spraying costs and the carbon
  emissions from idling and chemical production/transport, improving airline on-time performance. Air
  Canada is the launch customer, and the technology was featured in Time''s Best Inventions of 2024.
  De-Ice is a portfolio company of Playground Global. This is a company profile in the API Evangelist
  network; De-Ice publishes no public API, SDK, or developer surface at this time.'
